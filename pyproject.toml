[project]
name = "distributed-training"
version = "0.1.0"
description = "LLM fine-tuning tool for GPU distributed processing"
authors = [
  { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
  "torch>=2.7.0",
  "transformers>=4.30.0",
  "accelerate>=1.8.0",
  "deepspeed>=0.9.0",
  "peft>=0.4.0",
  "datasets>=3.6.0",
  "tokenizers>=0.13.0",
  "flash-attn>=2.7.0",
  "wandb>=0.15.0",
  "tensorboard>=2.13.0",
  "psutil>=5.9.0",
  "gpustat>=1.1.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0"
]
jupyter = [
  "jupyter>=1.0.0",
  "ipykernel>=6.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0"
]

[project.scripts]
gpu-train = "src.cli:app"

[build-system]
requires = [
  "hatchling",
  "torch>=2.7.0"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
